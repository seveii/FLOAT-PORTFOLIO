<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#5b2a6e"/>
      <stop offset="100%" stop-color="#1a0f2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#3a1f52"/>
      <stop offset="100%" stop-color="#1a0f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6b8ff"/>
      <stop offset="100%" stop-color="#ff8fd6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fae"/>
      <stop offset="100%" stop-color="#c04cff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="#170f24"/>
  <rect width="640" height="400" fill="url(#glow1)"/>
  <rect width="640" height="400" fill="url(#glow2)"/>

  <!-- star mark -->
  <path d="M40 34 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#c98bff"/>

  <!-- wordmark -->
  <text x="58" y="44" font-family="'Space Grotesk',sans-serif" font-size="24" font-weight="700" fill="url(#wordmark)">whispr.</text>
  <text x="58" y="62" font-family="'Inter',sans-serif" font-size="11" fill="#a89bc2">say the thing. stay no one.</text>

  <!-- stat pills -->
  <rect x="404" y="24" width="60" height="22" rx="11" fill="#2a1c3d"/>
  <circle cx="416" cy="35" r="4" fill="#ff8a4c"/>
  <text x="426" y="39" font-family="'Inter',sans-serif" font-size="10" fill="#d8cce8">0 today</text>

  <rect x="470" y="24" width="66" height="22" rx="11" fill="#2a1c3d"/>
  <circle cx="482" cy="35" r="4" fill="#e35fd8"/>
  <text x="492" y="39" font-family="'Inter',sans-serif" font-size="10" fill="#d8cce8">2 relates</text>

  <rect x="542" y="24" width="58" height="22" rx="11" fill="#2a1c3d"/>
  <circle cx="554" cy="35" r="4" fill="#4fd6e8"/>
  <text x="564" y="39" font-family="'Inter',sans-serif" font-size="10" fill="#d8cce8">11 total</text>

  <!-- main composer card -->
  <rect x="40" y="92" width="560" height="188" rx="18" fill="#20142f" stroke="#3c2a54" stroke-width="1"/>
  <text x="64" y="132" font-family="'Inter',sans-serif" font-size="16" fill="#cfc2e6">what's the thing you'd never say out loud? 👀</text>
  <text x="64" y="168" font-family="'Inter',sans-serif" font-size="10" fill="#8776a0">tip: add #hashtags to join today's trends</text>

  <!-- category pills -->
  <rect x="64" y="196" width="72" height="26" rx="13" fill="url(#btn)"/>
  <text x="84" y="213" font-family="'Inter',sans-serif" font-size="11" font-weight="600" fill="#fff">Love</text>

  <rect x="144" y="196" width="80" height="26" rx="13" fill="#2c1e42"/>
  <text x="164" y="213" font-family="'Inter',sans-serif" font-size="11" fill="#cfc2e6">Family</text>

  <rect x="232" y="196" width="82" height="26" rx="13" fill="#2c1e42"/>
  <text x="252" y="213" font-family="'Inter',sans-serif" font-size="11" fill="#cfc2e6">Career</text>

  <rect x="322" y="196" width="102" height="26" rx="13" fill="#2c1e42"/>
  <text x="342" y="213" font-family="'Inter',sans-serif" font-size="11" fill="#cfc2e6">Friendship</text>

  <!-- footer row -->
  <circle cx="76" cy="254" r="14" fill="#2c1e42"/>
  <rect x="70" y="248" width="12" height="10" rx="2" fill="#a993c9"/>
  <text x="470" y="248" font-family="'Inter',sans-serif" font-size="10" fill="#8776a0">0/500</text>
  <rect x="500" y="238" width="100" height="30" rx="15" fill="url(#btn)"/>
  <text x="520" y="258" font-family="'Inter',sans-serif" font-size="12" font-weight="700" fill="#fff">whisper it</text>

  <!-- feed tabs below -->
  <rect x="40" y="300" width="110" height="30" rx="10" fill="#2c1e42"/>
  <text x="58" y="320" font-family="'Inter',sans-serif" font-size="11" fill="#e6d9f7">✦ fresh</text>
  <rect x="158" y="300" width="150" height="30" rx="10" fill="#2c1e42"/>
  <text x="176" y="320" font-family="'Inter',sans-serif" font-size="11" fill="#e6d9f7">🔥 most related</text>
</svg>
